name: Validate public Micro.blog plugin

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check static/gis-dictionary/app.js
      - name: Validate static Micro.blog package
        run: node scripts/validate-plugin.mjs
